name: Buat Bucket S3 Otomatis
on: [push]

jobs:
  bikin-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Masuk ke AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY_ID }}
          aws-region: ap-southeast-1

      - name: Buat Bucket S3 Baru
        run: aws s3 mb s3://s3-cloud-mycloud --region ap-southeast-1

      - name: Cek Daftar Bucket S3
        run: aws s3 ls
